<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShikshaSetu-AI | Career Roadmap</title>

<style>
    * {

        padding: 0;

    }

    .logo {

    }

    }

        border: none;

        background: white;
        color: #1f2937;
        cursor: pointer;
    }

    .back-btn {

        text-decoration: none;
        background: rgba(255, 255, 255, 0.15);
        padding: 10px 16px;
        border-radius: 8px;
    }

    .container {

    }

        font-size: 30px;
        margin-bottom: 10px;
    }

    .hero p {
        color: #6b7280;
        line-height: 1.6;
    }

    .form-group {
        margin-bottom: 20px;
    }

        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

        border-radius: 9px;
        font-size: 16px;
        background: white;
    }

    .generate-btn {
        width: 100%;
        padding: 15px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 9px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .generate-btn:hover {
        background: #1d4ed8;
    }

    .roadmap {
        display: none;
    }

    .roadmap h2 {
        margin-bottom: 20px;
    }

    .step {

        border-left: 5px solid #2563eb;

        margin-bottom: 15px;
        border-radius: 10px;

        margin-bottom: 8px;
    }

    .step p {
        color: #6b7280;
        line-height: 1.5;
    }

    .skills {
        margin-top: 10px;
        font-weight: bold;
        color: #2563eb;

        .navbar {
            padding: 15px;
            flex-wrap: wrap;
        }

            font-size: 20px;
        }

        }

        }

</head>

<body>

<nav class="navbar">

<div class="logo">
    ShikshaSetu-AI
</div>

<div class="nav-right">

    <select id="languageSelect">
        <option value="en">English</option>
        <option value="hi">Hindi</option>
    </select>

    <a

        class="back-btn"
        id="backDashboard"

        Back to Dashboard
    </a>

</div>

</nav>

<main class="container">

<section class="hero">

    <h1 id="pageTitle">

    </p>

</section>

        <label

            id="careerGoalLabel"
        >
            Career Goal
        </label>

        <select id="careerGoal">

                id="careerPlaceholder"
            >
                Select career goal
            </option>

            <option value="software">
                Software Developer
            </option>

            <option value="data">
                Data Analyst
            </option>

            <option value="web">
                Web Developer
            </option>

            <option value="cyber">
                Cyber Security
            </option>

        </select>

    </div>

    <div class="form-group">

        <label
            for="educationLevel"
            id="educationLevelLabel"
        >
            Education Level
        </label>

        <select id="educationLevel">

            <option
                value=""
                id="educationPlaceholder"
            >
                Select education level
            </option>

            <option value="school">
                School Student
            </option>

            <option value="undergraduate">
                Undergraduate
            </option>

            <option value="postgraduate">
                Postgraduate
            </option>

        </select>

    </div>

    <button
        class="generate-btn"
        id="generateBtn"
    >
        Generate My Roadmap
    </button>

</section>

<section
    class="roadmap"
    id="roadmap"
>

    <h2 id="roadmapTitle">
        Your Career Roadmap
    </h2>

    <div id="roadmapSteps"></div>

</section>

</main>

<script src="js/language.js"></script>
